<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carta | Restaurante La Fortuna</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Lato:wght@300;400;700&display=swap">
  <style>
    :root {
      --color-primary: #3A3A3A;
      --color-primary-dark: #1F1F1F;
      --color-gold: #C49A9A;
      --color-gold-light: #E0C8C8;
      --color-ink: #1A1A1A;
      --color-text: #2C2C2C;
      --color-text-secondary: #6B6B6B;
      --color-text-muted: #9A9A9A;
      --color-bg: #FAF8F5;
      --color-bg-warm: #F0EBE5;
      --color-card: #FFFFFF;
      --color-border: #E0D8D0;
      --color-border-light: #EDE8E3;
      --font-display-zh: 'Noto Serif SC', serif;
      --font-display-en: 'Playfair Display', serif;
      --font-body-zh: 'Noto Sans SC', sans-serif;
      --font-body-en: 'Lato', sans-serif;
      --radius-md: 8px;
      --shadow-sm: 0 1px 2px rgba(44,31,23,0.06);
      --shadow-md: 0 4px 16px rgba(44,31,23,0.08);
      --shadow-lg: 0 8px 32px rgba(44,31,23,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body-zh), var(--font-body-en), sans-serif;
      background: var(--color-bg); color: var(--color-text);
      line-height: 1.6; font-size: 15px; min-height: 100vh; position: relative;
    }
    body::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(196,154,154,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(196,154,154,0.04) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .hero {
      position: relative; padding: 32px 20px 28px; text-align: center;
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF6F3 100%);
      color: var(--color-ink); overflow: hidden;
      border-bottom: 1px solid var(--color-border-light);
    }
    .hero::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(196,154,154,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(196,154,154,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }
    .logo-placeholder {
      width: 100%; max-width: 360px; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-placeholder img { width: 100%; height: auto; display: block; }
    .restaurant-name-zh {
      font-family: var(--font-display-zh); font-size: 24px; font-weight: 700;
      letter-spacing: 4px; margin-bottom: 4px; color: var(--color-ink);
    }
    .restaurant-name-es {
      font-family: var(--font-display-en); font-size: 16px; font-weight: 400;
      font-style: italic; color: var(--color-text-secondary); letter-spacing: 1px; margin-bottom: 16px;
    }
    .welcome-text {
      font-size: 13px; font-weight: 300; line-height: 1.8; opacity: 0.8;
      max-width: 320px; margin: 0 auto; color: var(--color-text-secondary);
    }
    .welcome-text .es {
      font-family: var(--font-body-en); font-style: italic; opacity: 0.8;
      display: block; margin-top: 2px;
    }
    .hero-divider {
      display: flex; align-items: center; justify-content: center; gap: 12px; margin: 24px 0 0;
    }
    .hero-divider .line { width: 60px; height: 1px; background: var(--color-gold); opacity: 0.5; }
    .hero-divider .diamond { width: 6px; height: 6px; background: var(--color-gold); transform: rotate(45deg); opacity: 0.6; }
    .lang-toggle {
      position: sticky; top: 0; z-index: 100; background: var(--color-bg);
      border-bottom: 1px solid var(--color-border-light); padding: 10px 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .lang-toggle-label { font-size: 12px; color: var(--color-text-secondary); margin-right: 4px; }
    .lang-switch {
      display: flex; background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: 20px; padding: 3px; gap: 2px;
    }
    .lang-btn {
      border: none; background: transparent; padding: 6px 14px; font-size: 12px;
      font-family: inherit; color: var(--color-text-secondary); border-radius: 16px;
      cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
    }
    .lang-btn.active { background: var(--color-primary); color: #fff; box-shadow: var(--shadow-sm); }
    .category-nav {
      position: sticky; top: 0; z-index: 99; background: var(--color-bg);
      border-bottom: 1px solid var(--color-border-light); padding: 10px 12px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-nav-inner { display: flex; gap: 8px; min-width: max-content; justify-content: flex-start; }
    .cat-nav-item {
      flex-shrink: 0; padding: 7px 14px; font-size: 13px; color: var(--color-text-secondary);
      background: var(--color-card); border: 1px solid var(--color-border); border-radius: 20px;
      cursor: pointer; transition: all 0.25s ease; font-family: var(--font-body-zh);
      display: flex; align-items: center; gap: 6px;
    }
    .cat-nav-item .cat-nav-es { font-family: var(--font-body-en); font-size: 11px; opacity: 0.7; font-style: italic; }
    .cat-nav-item.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .cat-nav-item.active .cat-nav-es { opacity: 0.85; }
    .main-content { position: relative; z-index: 1; padding: 24px 16px 40px; max-width: 640px; margin: 0 auto; }
    .category-section { margin-bottom: 40px; scroll-margin-top: 60px; }
    .category-header { text-align: center; margin-bottom: 24px; }
    .category-title-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px; }
    .category-title-line { flex: 0 0 40px; height: 1px; background: var(--color-gold); opacity: 0.6; }
    .category-title-zh { font-family: var(--font-display-zh); font-size: 22px; font-weight: 700; color: var(--color-ink); letter-spacing: 3px; }
    .category-title-es { font-family: var(--font-display-en); font-size: 22px; font-weight: 700; color: var(--color-ink); letter-spacing: 1px; }
    .category-subtitle { font-size: 12px; color: var(--color-text-muted); font-weight: 300; margin-top: 4px; }
    .category-decor { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; }
    .category-decor .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--color-gold); opacity: 0.5; }
    .category-decor .dot.middle { width: 6px; height: 6px; opacity: 0.8; }
    .dish-list { display: flex; flex-direction: column; gap: 12px; }
    .dish-card {
      background: var(--color-card); border: 1px solid var(--color-border-light);
      border-radius: var(--radius-md); padding: 14px 16px; transition: all 0.25s ease;
      position: relative; overflow: hidden;
    }
    .dish-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--color-primary), var(--color-gold));
      opacity: 0; transition: opacity 0.25s ease;
    }
    .dish-card:hover { box-shadow: var(--shadow-md); border-color: var(--color-border); transform: translateY(-1px); }
    .dish-card:hover::before { opacity: 1; }
    .dish-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
    .dish-names { flex: 1; min-width: 0; }
    .dish-name-zh { font-family: var(--font-display-zh); font-size: 15px; font-weight: 600; color: var(--color-ink); line-height: 1.4; }
    .dish-name-es { font-family: var(--font-display-en); font-size: 15px; font-weight: 600; color: var(--color-ink); line-height: 1.4; }
    .dish-price { flex-shrink: 0; text-align: right; }
    .price-number { font-family: var(--font-display-en); font-size: 15px; font-weight: 700; color: var(--color-primary); line-height: 1.2; white-space: nowrap; }
    .price-unit { font-family: var(--font-body-en); font-size: 10px; color: var(--color-text-muted); margin-top: 2px; }
    .dish-description { font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; margin-top: 6px; font-weight: 300; }
    .dish-desc-es { font-family: var(--font-body-en); font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
    .dish-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .dish-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--color-bg-warm); color: var(--color-text-secondary); font-family: var(--font-body-en); }
    .dish-tag.spicy { background: rgba(184,57,46,0.1); color: var(--color-primary); }
    .dish-tag.veggie { background: rgba(46,139,87,0.1); color: #2E8B57; }
    .dish-tag.recommend { background: rgba(212,162,74,0.15); color: #B8860B; }
    .lang-mode-bilingual .dish-name-es, .lang-mode-bilingual .dish-desc-es,
    .lang-mode-bilingual .category-title-es, .lang-mode-bilingual .cat-nav-es,
    .lang-mode-bilingual .restaurant-name-es, .lang-mode-bilingual .welcome-text .es { display: block; }
    .lang-mode-zh .dish-name-es, .lang-mode-zh .dish-desc-es,
    .lang-mode-zh .category-title-es, .lang-mode-zh .cat-nav-es,
    .lang-mode-zh .restaurant-name-es, .lang-mode-zh .welcome-text .es { display: none; }
    .lang-mode-es .dish-name-zh, .lang-mode-es .category-title-zh,
    .lang-mode-es .cat-nav-item > span:first-child, .lang-mode-es .restaurant-name-zh,
    .lang-mode-es .welcome-text .zh { display: none; }
    .lang-mode-es .dish-desc-es { display: block; }
    .lang-mode-es .dish-description > span:not(.dish-desc-es) { display: none; }
    .lang-mode-es .dish-description .dish-desc-es { font-size: 12px; font-style: normal; opacity: 1; }
    .footer {
      position: relative; z-index: 1; background: var(--color-ink);
      color: rgba(255,255,255,0.85); padding: 40px 20px 28px; text-align: center;
    }
    .footer-logo { margin-bottom: 16px; }
    .footer-logo .name-zh { font-family: var(--font-display-zh); font-size: 20px; font-weight: 600; color: #fff; letter-spacing: 3px; }
    .footer-logo .name-es { font-family: var(--font-display-en); font-style: italic; font-size: 14px; color: var(--color-gold-light); margin-top: 2px; }
    .footer-divider { width: 40px; height: 1px; background: var(--color-gold); margin: 16px auto; opacity: 0.5; }
    .footer-info { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; font-size: 13px; font-weight: 300; line-height: 1.7; }
    .footer-info-item { display: flex; align-items: flex-start; justify-content: center; gap: 10px; }
    .footer-info-item svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; stroke: var(--color-gold-light); opacity: 0.8; }
    .footer-info-item .info-text { text-align: left; }
    .footer-info-item .info-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-body-en); }
    .call-btn {
      display: inline-flex; align-items: center; gap: 10px; background: var(--color-primary); color: #fff;
      padding: 14px 28px; border-radius: 30px; text-decoration: none; font-size: 15px;
      font-weight: 500; transition: all 0.25s ease; box-shadow: 0 4px 16px rgba(58,58,58,0.3); margin-bottom: 28px;
    }
    .call-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(58,58,58,0.4); background: var(--color-primary-dark); }
    .call-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .footer-copyright { font-size: 11px; color: rgba(255,255,255,0.35); font-family: var(--font-body-en); }
    @media (min-width: 640px) {
      .hero { padding: 40px 20px 32px; }
      .restaurant-name-zh { font-size: 34px; }
      .restaurant-name-es { font-size: 20px; }
      .welcome-text { font-size: 14px; max-width: 400px; }
      .main-content { padding: 32px 24px 48px; }
      .dish-card { padding: 16px 20px; }
      .dish-name-zh { font-size: 16px; }
      .dish-name-es { font-size: 16px; }
      .price-number { font-size: 17px; }
      .dish-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .category-title-wrap { gap: 24px; }
      .category-title-line { flex-basis: 80px; }
      .footer-info { max-width: 480px; margin-left: auto; margin-right: auto; }
    }
    @media (min-width: 900px) {
      .dish-list { grid-template-columns: 1fr 1fr; gap: 16px; }
      .main-content { max-width: 800px; }
    }
    .scroll-top-btn {
      position: fixed; right: 16px; bottom: 24px; width: 44px; height: 44px;
      border-radius: 50%; background: var(--color-primary); color: #fff; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(10px);
      transition: all 0.3s ease; pointer-events: none; z-index: 200;
    }
    .scroll-top-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .scroll-top-btn svg { width: 20px; height: 20px; stroke: #fff; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .dish-card { animation: fadeInUp 0.4s ease both; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

    function renderDishes() {
      const container = document.getElementById('dishContainer');
      let html = '';
      const tagsHtml = (tags) => {
        if (!tags || tags.length === 0) return '';
        return '<div class="dish-tags">' + tags.map(t => '<span class="dish-tag ' + t.type + '">' + t.text + '</span>').join('') + '</div>';
      };
      menuData.forEach((cat) => {
        const dishesHtml = cat.dishes.map(dish =>
          '<article class="dish-card">' +
            '<div class="dish-header">' +
              '<div class="dish-names">' +
                '<h3 class="dish-name-es">' + dish.es + '</h3>' +
              '</div>' +
              '<div class="dish-price"><span class="price-number">' + dish.price + '</span></div>' +
            '</div>' +
            '<div class="dish-description"><span class="dish-desc-es">' + dish.descEs + '</span></div>' +
            tagsHtml(dish.tags) +
          '</article>'
        ).join('');
        html +=
          '<section class="category-section" id="' + cat.category + '">' +
            '<div class="category-header">' +
              '<div class="category-title-wrap">' +
                '<span class="category-title-line"></span>' +
                '<div><h2 class="category-title-es">' + cat.categoryEs + '</h2></div>' +
                '<span class="category-title-line"></span>' +
              '</div>' +
              '<p class="category-subtitle">' + cat.subtitleEs + '</p>' +
              '<div class="category-decor"><span class="dot"></span><span class="dot middle"></span><span class="dot"></span></div>' +
            '</div>' +
            '<div class="dish-list">' + dishesHtml + '</div>' +
          '</section>';
      });
      container.innerHTML = html;
    }

    function initCategoryNav() {
      const navItems = document.querySelectorAll('.cat-nav-item');
      navItems.forEach(item => {
        item.addEventListener('click', () => {
          const targetEl = document.getElementById(item.dataset.target);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      const sections = document.querySelectorAll('.category-section');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            navItems.forEach(item => item.classList.toggle('active', item.dataset.target === entry.target.id));
          }
        });
      }, { root: null, rootMargin: '-120px 0px -60% 0px', threshold: 0 });
      sections.forEach(section => observer.observe(section));
    }

    function initScrollTop() {
      const btn = document.getElementById('scrollTopBtn');
      window.addEventListener('scroll', () => btn.classList.toggle('visible', window.scrollY > 400), { passive: true });
      btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderDishes();
      initCategoryNav();
      initScrollTop();
    });
  </script>
